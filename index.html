<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ma Collection</title>
  <meta name="theme-color" content="#0f0a1f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="theme-synthwave">
  <div id="bg"></div>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" aria-label="Retour" hidden>‹</button>
    <div id="logo" class="logo" title="Accueil"></div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu" hidden>⋯</button>
  </header>

  <main id="app"><p class="loading">Chargement…</p></main>

  <button id="fab" class="fab" aria-label="Ajouter" hidden>+</button>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" hidden></div>

  <script>
    // Affiche une erreur à l'écran au lieu de rester bloqué sur « Chargement »
    window.addEventListener('error', function (e) {
      var a = document.getElementById('app');
      if (a && /Chargement/.test(a.textContent)) a.innerHTML = '<p class="loading">Oups : ' + (e.message || 'erreur de chargement') + '<br>Actualise la page.</p>';
    }, true);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
  <script src="config.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
